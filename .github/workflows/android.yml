name: Android CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build Project
      run: |
        echo "Searching for build files..."
        find . -name "build.gradle"
        
    - name: Upload Workspace Files
      uses: actions/upload-artifact@v4
      with:
        name: project-files
        path: .
